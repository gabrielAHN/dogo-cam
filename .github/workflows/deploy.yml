name: Deploy to dogo-cam Pi

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy talks to the Pi over SSH; it never needs the GITHUB_TOKEN.
permissions: {}

concurrency:
  group: deploy-pi
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.repository == 'gabrielAHN/dogo-cam' && github.event_name != 'pull_request' }}
    runs-on: [self-hosted, macmini]
    steps:
      - name: Trigger deploy on the Pi
        # Uses a dedicated, command-locked SSH key: the Pi runs a fixed deploy
        # script (git reset --hard origin/main + restart) regardless of any
        # command sent, so this key/runner can do nothing else on the Pi.
        run: >-
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15
          -i ~/.ssh/dogcam_deploy hidalgo-cam@192.168.100.10 deploy
